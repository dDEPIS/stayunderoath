<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ if not .IsHome }}{{ .Title }} | {{ end }}{{ site.Title }}</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body data-shader="{{ .Params.shader | default site.Params.defaultShader | default "Chains" }}">

  <!-- UI Overlay Wrapper (pointer-events pass through to WebGPU canvas on empty space) -->
  <main class="ui-layer">
    {{ block "main" . }}{{ end }}
  </main>

  <!-- Modular WebGPU Background Renderer -->
  {{ partial "webgpu-renderer.html" . }}
</body>
</html>
