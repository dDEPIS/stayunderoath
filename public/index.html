ovingChain(p, vec3f(1.60, 0.0, -0.5), vec3f(-0.12, -0.35, -0.22), 1.65, 0.82, 4.0, wild);\r\n  if (c4.x \u003c res.x) \u007b res = c4; \u007d\r\n\r\n  \/\/ Chain 5: Background horizontal-ish sweep (Moving RIGHT)\r\n  let c5 = sdMovingChain(p, vec3f(0.0, 0.95, -1.5), vec3f(0.30, 0.10, 1.42), 1.15, 1.10, 5.0, wild);\r\n  if (c5.x \u003c res.x) \u007b res = c5; \u007d\r\n\r\n  \/\/ Chain 6: Deep background low sweep (Moving LEFT)\r\n  let c6 = sdMovingChain(p, vec3f(0.0, -1.05, -1.8), vec3f(-0.25, -0.20, -1.35), -1.35, 1.15, 6.0, wild);\r\n  if (c6.x \u003c res.x) \u007b res = c6; \u007d\r\n\r\n  return res;\r\n\u007d\r\n\r\n\/\/ 4-sample Tetrahedral Normal\r\nfn calc_normal(p: vec3f) -\u003e vec3f \u007b\r\n  let e = vec2f(1.0, -1.0) * 0.57735027 * NORMAL_EPS;\r\n  return normalize(\r\n    e.xyy * map(p \u002b e.xyy).x \u002b\r\n    e.yyx * map(p \u002b e.yyx).x \u002b\r\n    e.yxy * map(p \u002b e.yxy).x \u002b\r\n    e.xxx * map(p \u002b e.xxx).x\r\n  );\r\n\u007d\r\n\r\n@fragment\r\nfn fs_main(@builtin(position) pos: vec4f) -\u003e @location(0) vec4f \u007b\r\n  let resolution = uniforms.resolution;\r\n  let uv = (pos.xy * 2.0 - resolution) \/ resolution.y;\r\n  let uv_flipped = vec2f(uv.x, -uv.y);\r\n\r\n  let wild = getWildEventFactor(uniforms.time);\r\n\r\n  \/\/ Orbit camera driven by mouse\/gyro yaw and pitch\r\n  let yaw = uniforms.yaw * 0.35;\r\n  let pitch = clamp(uniforms.pitch, -1.0, 1.0) * CAM_PITCH_GAIN;\r\n  let ro = vec3f(\r\n    CAM_RADIUS * cos(pitch) * sin(yaw),\r\n    CAM_RADIUS * sin(pitch),\r\n    CAM_RADIUS * cos(pitch) * cos(yaw)\r\n  );\r\n\r\n  let lookAt = vec3f(0.0, 0.0, 0.0);\r\n  let fwd = normalize(lookAt - ro);\r\n  let right = normalize(cross(vec3f(0.0, 1.0, 0.0), fwd));\r\n  let up = cross(fwd, right);\r\n  let rd = normalize(fwd \u002b right * uv_flipped.x \u002b up * uv_flipped.y);\r\n\r\n  var t = 0.0;\r\n  var hit = false;\r\n  var mat_id = 0.0;\r\n\r\n  let primary_accent = mix(COLOR_RED, COLOR_WHITE, uniforms.color_t);\r\n  let         if (keyBuffer === SECRET_HUD_CODE) {
          setPerfHudVisible(!showPerfHud);
          keyBuffer = "";
          return;
        }
      }
      if (k === "c") triggerShiftAndWild();
      if (k === "q" && showPerfHud) toggleMaxQualityMode();
    });

    window.addEventListener("pointerdown", (e) => {
      pressX = e.clientX;
      pressY = e.clientY;
    });

    window.addEventListener("pointerup", (e) => {
      if (e.button !== undefined && e.button !== 0) return;
      if (e.target === perfHud || (e.target && e.target.closest && e.target.closest("a, button, input, textarea, select"))) return;

      const travel = Math.abs(e.clientX - pressX) + Math.abs(e.clientY - pressY);
      if (travel < 15) {
        if (e.clientX < 100 && e.clientY < 100) {
          const nowMs = performance.now();
          cornerTapCount = (nowMs - lastCornerTapTime < 600) ? cornerTapCount + 1 : 1;
          lastCornerTapTime = nowMs;
          if (cornerTapCount >= SECRET_CORNER_TAPS) {
            setPerfHudVisible(!showPerfHud);
            cornerTapCount = 0;
            return;
          }
        } else {
          cornerTapCount = 0;
        }
        triggerShiftAndWild();
      }
    });

    window.addEventListener("pointermove", (e) => {
      if (usingTilt) return;
      let rawYaw = Math.max(-1.0, Math.min(1.0, (e.clientX / window.innerWidth) * 2.0 - 1.0));
      let rawPitch = Math.max(-1.0, Math.min(1.0, (e.clientY / window.innerHeight) * 2.0 - 1.0));
      inputState.spinInput = applySensitivityCurve(rawYaw, 3);
      inputState.cameraPitch = applySensitivityCurve(rawPitch, 3);
    });

    let currentQuality = forceMaxQuality ? 2.0 : 0.5;
    let targetQuality = currentQuality;

    function applySize() {
      const w = Math.max(1, Math.floor(window.innerWidth * renderScale));
      const h = Math.max(1, Math.floor(window.innerHeight * renderScale));
      if (w !== canvas.width || h !== canvas.height) {
        canvas.width = w;
        canvas.height = h;
      }
    }

    function applyVisual(dt = 0.016) {
      const t = Math.min(1.0, Math.max(0.0, (renderScale - activeConfig.minScale) / Math.max(1e-4, (maxScale - activeConfig.minScale))));
      targetQuality = forceMaxQuality ? 2.0 : (reduce ? 0.5 : t * 2.0);
      currentQuality += (targetQuality - currentQuality) * Math.min(1.0, GLOBAL_SETTINGS.qualityLerp * dt);
    }

    window.addEventListener("resize", applySize);
    applySize();

    let frameMs = [];
    function governor() {
      if (frameMs.length < GLOBAL_SETTINGS.govWindow) return;
      const avg = frameMs.reduce((a, b) => a + b, 0) / frameMs.length;
      const maxSpike = Math.max(...frameMs);
      frameMs.length = 0;

      if (showPerfHud) {
        const fps = 1000.0 / Math.max(0.001, avg);
        const scalePct = Math.round(renderScale * 100);
        perfHud.textContent =
          `Shader:  ${activeKey}\n` +
          `FPS:     ${fps.toFixed(1)} (${avg.toFixed(2)} ms | max ${maxSpike.toFixed(1)} ms)\n` +
          `Res:     ${canvas.width}x${canvas.height} (${scalePct}%) | Q: ${currentQuality.toFixed(2)}`;
      }

      if (forceMaxQuality || reduce) return;
      if (avg > GLOBAL_SETTINGS.slowMs) {
        targetScale = Math.max(activeConfig.minScale, targetScale - GLOBAL_SETTINGS.downStep);
      } else if (avg < GLOBAL_SETTINGS.fastMs) {
        targetScale = Math.min(maxScale, targetScale + GLOBAL_SETTINGS.upStep);
      }
    }

    let lastTime = performance.now() / 1000;
    function frame() {
      const now = performance.now() / 1000;
      const rawDt = now - lastTime;
      const dt = Math.min(rawDt, 0.1);
      lastTime = now;

      frameMs.push(rawDt * 1000);
      governor();

      const desiredScale = forceMaxQuality ? getForcedScale() : targetScale;
      renderScale += (desiredScale - renderScale) * Math.min(1, GLOBAL_SETTINGS.scaleLerp * dt);
      applySize();
      applyVisual(dt);

      let speed = inputState.spinInput * GLOBAL_SETTINGS.spinSpeed;
      if (speed >= 0 && speed < GLOBAL_SETTINGS.minSpin) speed = GLOBAL_SETTINGS.minSpin;
      else if (speed < 0 && speed > -GLOBAL_SETTINGS.minSpin) speed = -GLOBAL_SETTINGS.minSpin;
      inputState.cameraYaw += speed * dt;
      inputState.colorT += (inputState.targetColorT - inputState.colorT) * GLOBAL_SETTINGS.colorFade * dt;

      activeConfig.updateUniforms(uniformValues, canvas.width, canvas.height, now, currentQuality);
      device.queue.writeBuffer(uniformBuffer, 0, uniformValues);

      const encoder = device.createCommandEncoder();
      const pass = encoder.beginRenderPass({
        colorAttachments: [{
          view: context.getCurrentTexture().createView(),
          clearValue: { r: 0.0, g: 0.0, b: 0.0, a: 1.0 },
          loadOp: "clear",
          storeOp: "store",
        }],
      });
      pass.setPipeline(pipeline);
      pass.setBindGroup(0, bindGroup);
      pass.draw(3);
      pass.end();
      device.queue.submit([encoder.finish()]);

      requestAnimationFrame(frame);
    }
    frame();
  }

  initWebGPU();
</script>
</body>
</html>
